version: 2.1

jobs:
  test:
    resource_class: buildpulse/bp-ubuntu-latest-x64-4x
    docker:
      - image: cimg/android:2025.01
    steps:
      - checkout

      - run:
          name: Set up JDK 17
          command: |
            sudo apt-get update
            sudo apt-get install openjdk-17-jdk

      - restore_cache:
          keys:
            - my-cache-2

      - run:
          name: Build with Gradle
          command: ./gradlew qa

      - run:
          name: Archive reports for failed build
          command: |
            if [ $? -ne 0 ]; then
              mkdir -p ~/reports
              cp -r */build/reports/* ~/reports/
            fi

workflows:
  version: 2
  build-workflow:
    jobs:
      - test:
          post-steps: # steps to run after steps defined in the job bar
            - save_cache:
                when: always
                key: my-cache-2
                paths:
                  - .gradle/
